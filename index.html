<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b1827">
  <title>ဆက်သွယ်ရန်</title>
  <style>
    :root {
      --burgundy: #5b1827;
      --burgundy-deep: #35101a;
      --gold: #e4bd62;
      --cream: #fbf7ef;
      --ink: #3d2630;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(228,189,98,.15), transparent 25%),
        radial-gradient(circle at 85% 78%, rgba(91,24,39,.09), transparent 27%),
        var(--cream);
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, sans-serif;
    }
    .circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(91,24,39,.035);
      box-shadow: 0 18px 55px rgba(53,16,26,.08);
    }
    .circle.one { width: 300px; height: 300px; top: -115px; right: -70px; }
    .circle.two { width: 190px; height: 190px; bottom: -70px; left: -35px; background: rgba(228,189,98,.12); }
    .circle.three { width: 74px; height: 74px; top: 22%; left: 13%; background: rgba(228,189,98,.13); }
    main {
      position: relative;
      z-index: 1;
      width: min(100%, 680px);
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 52px 28px;
      border: 1px solid rgba(91,24,39,.08);
      border-radius: 26px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 24px 70px rgba(53,16,26,.09);
      backdrop-filter: blur(8px);
    }
    .eyebrow {
      margin: 0 0 30px;
      color: var(--burgundy);
      font-size: clamp(15px, 2.5vw, 19px);
      line-height: 1.8;
      letter-spacing: .1px;
    }
    .contact-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      min-width: min(100%, 270px);
      min-height: 66px;
      padding: 17px 34px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 13px;
      background: linear-gradient(135deg, var(--burgundy), var(--burgundy-deep));
      color: #fff9ec;
      text-decoration: none;
      font-size: 21px;
      font-weight: 700;
      box-shadow: 0 12px 25px rgba(91,24,39,.22);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .contact-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 30px rgba(91,24,39,.27);
    }
    .contact-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    @media (max-width: 480px) {
      main { min-height: 300px; padding: 42px 20px; border-radius: 20px; }
      .eyebrow { margin-bottom: 25px; }
      .contact-button { min-height: 60px; font-size: 19px; padding: 15px 25px; }
      .circle.one { width: 220px; height: 220px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="circle one" aria-hidden="true"></div>
  <div class="circle two" aria-hidden="true"></div>
  <div class="circle three" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">3000 အသွင်း 9000 ဆွတ်ယူလိုက်ပါ</p>
    <a class="contact-button" href="https://smlay.com/" target="_blank" rel="noopener noreferrer">
      ဆက်သွယ်ရန်
    </a>
  </main>
</body>
</html>
